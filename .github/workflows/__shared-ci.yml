name: Common Continuous Integration tasks

on:
  workflow_call:
    outputs:
      build-artifact-id:
        description: "The build artifact ID"
        value: ${{ jobs.continuous-integration.outputs.build-artifact-id }}

permissions: {}

jobs:
  lint:
    name: linter
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@57ec4a8bf0ab9ea52beea725b5e59895ed39f4f2 # PR #683 (unreleased)
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  continuous-integration-actions:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@277d184953d7a515fe4271eb0532eebc53d6e214 # PR #624 (unreleased)
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
      actions: read
    strategy:
      matrix:
        working-directory:
          - .github/actions/generate-blog-post
          - .github/actions/generate-brand-content
          - .github/actions/validate-manifest
    with:
      working-directory: ${{ matrix.working-directory }}
      build: ""
      lint: ""
      dependency-review: false

  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@277d184953d7a515fe4271eb0532eebc53d6e214 # PR #624 (unreleased)
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
      actions: read
    with:
      working-directory: application
      build: |
        {
          "artifact": ["dist"]
        }
      lint: '{"lint-results":"lint.sarif\nastro-report.txt\nhumanize-report-checkstyle.xml"}'

  reports:
    needs:
      - lint
      - continuous-integration-actions
      - continuous-integration
    if: ${{ !cancelled() }}
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@57ec4a8bf0ab9ea52beea725b5e59895ed39f4f2 # PR #683 (unreleased)
    permissions:
      actions: read
      contents: read
      pull-requests: write
      code-quality: write
      id-token: write
      security-events: write
    with:
      job-results: ${{ toJSON(needs) }}
