name: Common Continuous Integration tasks

on:
  workflow_call:
    outputs:
      build-artifact-id:
        description: "The build artifact ID"
        value: ${{ jobs.continuous-integration.outputs.build-artifact-id }}

permissions: {}

jobs:
  lint:
    name: linter
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@a0bdfab27afed208f3c105e4b543818b8388b80b # PR #683 (unreleased)
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  continuous-integration-actions:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@570c8389e95924c64933ea1e95f555ad7739a46f # PR #624 (unreleased)
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
      actions: read
    strategy:
      matrix:
        working-directory:
          - .github/actions/generate-blog-post
          - .github/actions/generate-brand-content
          - .github/actions/validate-manifest
    with:
      working-directory: ${{ matrix.working-directory }}
      build: ""
      lint: ""
      test: '{"test-results":"junit.xml","test-coverage":"coverage/lcov.info"}'
      dependency-review: false

  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@570c8389e95924c64933ea1e95f555ad7739a46f # PR #624 (unreleased)
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
      actions: read
    with:
      working-directory: application
      build: |
        {
          "artifact": ["dist"]
        }
      lint: '{"lint-results":"lint.sarif\nastro-report.txt\nhumanize-report-checkstyle.xml"}'

  reports:
    needs:
      - lint
      - continuous-integration-actions
      - continuous-integration
    if: always()
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@a0bdfab27afed208f3c105e4b543818b8388b80b # PR #683 (unreleased)
    permissions:
      actions: read
      contents: read
      pull-requests: write
      code-quality: write
      id-token: write
      security-events: write
    with:
      job-results: ${{ toJSON(needs) }}

  complete:
    name: CI complete
    if: always()
    needs:
      - lint
      - continuous-integration-actions
      - continuous-integration
      - reports
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: hoverkraft-tech/ci-github-common/actions/check-jobs@a0bdfab27afed208f3c105e4b543818b8388b80b # PR #683 (unreleased)
        with:
          job-results: ${{ toJSON(needs) }}
